  <div class="content"><p></p><div class="separator" style="clear: both; text-align: center;"><a href="/assets/img/5e450d1c717a.png" style="margin-left: 1em; margin-right: 1em;"><img alt="" data-original-height="314" data-original-width="510" height="228" src="/assets/img/26deb4e1fd66.png" width="393" /></a></div><br /><br /><p></p><p>1，cloudflare主页找到自定义域名点击域名进入，依次点击左侧缓存---Cache Rules</p><div class="separator" style="clear: both; text-align: center;"><a href="/assets/img/603d12b86946.png" style="margin-left: 1em; margin-right: 1em;"><img border="0" data-original-height="1216" data-original-width="2554" height="149" src="/assets/img/603d12b86946.png" width="314" /></a></div><br /><p><br /></p><p></p><div class="separator" style="clear: both; text-align: center;"><a href="/assets/img/0397a5d57460.png" style="margin-left: 1em; margin-right: 1em;"><img border="0" data-original-height="1250" data-original-width="2516" height="159" src="/assets/img/0397a5d57460.png" width="320" /></a></div><br /><p></p><p>2，添加自定义规则，规则名填写，添加主机名和URL规则，填写自定义域名和/UUID</p><p>自定义域名是项目里面带前缀的，UUID是项目的的UUID</p><div class="separator" style="clear: both; text-align: center;"><a href="/assets/img/8963c89ac1b2.png" style="margin-left: 1em; margin-right: 1em;"><img border="0" data-original-height="1304" data-original-width="2552" height="164" src="/assets/img/8963c89ac1b2.png" width="320" /></a></div><br /><p><br /></p><p>3，填写完上面继续向下看，添加边缘TTL和浏览器TTL，填写完拉到最底部保存即可!</p><div class="separator" style="clear: both; text-align: center;"><a href="/assets/img/5244f86b95e9.png" style="margin-left: 1em; margin-right: 1em;"><img border="0" data-original-height="1168" data-original-width="2388" height="157" src="/assets/img/5244f86b95e9.png" width="320" /></a></div><br /><p><br /></p><br /></div>

<script>
(function() {
  var els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    els.forEach(function(e) { e.classList.add('visible'); });
    return;
  }
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(en) {
      if (en.isIntersecting) {
        en.target.classList.add('visible');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.1 });
  els.forEach(function(e, i) {
    e.style.transitionDelay = (i % 6) * 60 + 'ms';
    io.observe(e);
  });
})();
</script>
